[project]
name = "astrbot-plugin-stockwatcher"
version = "0.2.0"
description = "Personal stock watcher for AstrBot"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
